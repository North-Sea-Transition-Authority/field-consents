version: '3.9'

services:

  local-db:
    image: postgres:14.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev1
      POSTGRES_DB: fcs
    volumes:
      - db-volume:/var/lib/postgresql/data
      - ./create_db_user.sh:/docker-entrypoint-initdb.d/create_db_user.sh

  clamav:
    image: clamav/clamav:stable
    ports:
    - "3310:3310"

  minio:
    image: bitnami/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: field-consents

volumes:
  db-volume: