name: field-consents
services:
  postgres:
    image: postgres:14.23-alpine
    ports:
      - target: 5432
        published: 5432
    environment:
      POSTGRES_DB: fcs
      POSTGRES_USER: fcs_app
      POSTGRES_PASSWORD: dev1
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:stable
    ports:
    - "127.0.0.1:3310:3310"

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    entrypoint: sh
    command:
      -c "mkdir -p /data/field-consents && /usr/bin/minio server /data --console-address ':9001'"

volumes:
  postgres-data: