energy-portal.registration-url="https://portal-registration-url"
energy-portal.logout-url="https://portal-logout-url"

# Flyway
spring.flyway.schemas=fcs

# File upload library
file-upload.s3.access-key=access-key
file-upload.s3.secret-token=secret-token
file-upload.s3.default-bucket=field-consents
file-upload.s3.endpoint=localhost:9090
file-upload.s3.signing-region=example
file-upload.s3.disable-ssl=true
file-upload.s3.proxy.host=
file-upload.s3.proxy.port=
file-upload.default-maximum-file-size=50MB
file-upload.default-permitted-file-extensions="pdf"
file-upload.clamav.host=localhost
file-upload.clamav.port=3310
file-upload.clamav.timeout=PT1M
